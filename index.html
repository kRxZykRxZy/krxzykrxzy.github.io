<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore | My Website</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            box-shadow: 0 0 20px #00ffaa;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #00ffaa;
            text-shadow: 0 0 10px #00ffaa;
        }

        .btn-container {
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #00ffaa, #00d4ff);
            color: #1f1f1f;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 12px #00ffaa;
        }

        .btn:hover {
            background: linear-gradient(135deg, #00d4ff, #00ffaa);
            color: #1f1f1f;
            transform: scale(1.1) rotate(2deg);
        }

        .content {
            margin-top: 20px;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ccc;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #1f1f1f;
            border-radius: 12px;
            box-shadow: 0 0 10px #00ffaa;
            padding: 20px;
            overflow: hidden;
        }

        #chat-box {
            height: 400px;
            overflow-y: auto;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 10px;
        }

        .admin {
            color: #00ffaa;
        }

        input, button {
            padding: 10px;
            border-radius: 5px;
            border: none;
        }

        input {
            width: 70%;
            margin-right: 10px;
        }

        button {
            background-color: #00ffaa;
            color: #1f1f1f;
            cursor: pointer;
        }

        button:hover {
            background-color: #00d4ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Websites</h1>
        <div class="btn-container">
            <a href="https://ubbload.netlify.app" class="btn" target="_blank">Ubbload</a>
            <a href="https://scratch-coding-hut.github.io" class="btn" target="_blank">Scratch Coding Hut</a>
        </div>
        <div class="content">
            <p>Welcome to my digital universe! Explore my projects and get ready for mind-blowing innovations. More exciting things are coming your way!</p>
            <ul>
                <li><span class="placeholder">More sites coming soon...</span></li>
            </ul>
        </div>
    </div>

    <div class="chat-container">
        <h2>🔊 Private Chat</h2>
        <div id="chat-box"></div>
        <input type="text" id="message" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
        <div id="admin-controls" style="display: none; margin-top: 20px;">
            <h3>⚡ Admin Controls</h3>
            <input type="text" id="admin-message" placeholder="Reply as Admin...">
            <button onclick="adminReply()">Send Reply</button>
        </div>
    </div>

    <script>
        const code = '95.214.228.44';
        const chatId = Date.now();
        let isAdmin = false;
        let messages = [];

        async function fetchMessages() {
            try {
                const res = await fetch('https://api.jsonbin.io/v3/b/67c73db1e41b4d34e4a0bfb1/latest', {
                    method: 'GET'
                });
                const data = await res.json();
                messages = data.record || [];
                loadMessages();
            } catch (error) {
                console.error('Error fetching messages:', error);
            }
        }

        async function saveMessages() {
            try {
                const res = await fetch('https://api.jsonbin.io/v3/b/67c73db1e41b4d34e4a0bfb1', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ record: messages })
                });
                await res.json();
            } catch (error) {
                console.error('Error saving messages:', error);
            }
        }

        function loadMessages() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                chatBox.innerHTML += `<div class="message ${msg.user === 'Admin' ? 'admin' : ''}"><strong>${msg.user}:</strong> ${msg.message}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const msg = document.getElementById('message').value;
            if (msg.trim() !== '') {
                const message = { user: 'User', message: msg, chatId: chatId };
                messages.push(message);
                document.getElementById('message').value = '';
                loadMessages();
                saveMessages();
            }
        }

        function adminReply() {
            const msg = document.getElementById('admin-message').value;
            if (msg.trim() !== '') {
                const message = { user: 'Admin', message: msg, chatId: chatId };
                messages.push(message);
                document.getElementById('admin-message').value = '';
                loadMessages();
                saveMessages();
            }
        }

        async function checkAdmin() {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            if (data.ip === code) {
                document.getElementById('admin-controls').style.display = 'block';
                isAdmin = true;
            }
        }

        window.onload = () => {
            checkAdmin();
            fetchMessages();
        };

    </script>
</body>
</html>
